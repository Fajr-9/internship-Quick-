<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A responsive calculator built with vanilla JavaScript and CSS Grid.">
  <title>Calculator | Fajr Frontend Project</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/calculator.css">
</head>
<body data-theme="dark">
  <div id="loader">
    <div class="loader-spinner" role="status" aria-label="Loading"></div>
  </div>

  <header>
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top navbar-scrolled">
      <div class="container">
        <a class="navbar-brand" href="../index.html">Fajr Dev</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="mainNav">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link" href="../index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="portfolio.html">Portfolio</a></li>
            <li class="nav-item"><a class="nav-link" href="blog.html">Blog</a></li>
            <li class="nav-item"><a class="nav-link" href="products.html">Products</a></li>
            <li class="nav-item"><a class="nav-link" href="calculator.html">Calculator</a></li>
            <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section class="calculator-section page-hero-offset" aria-label="Calculator">
      <div class="calculator-card">
        <div class="calculator-display">
          <div class="display-expression" aria-live="polite"></div>
          <div class="display-result" aria-live="polite">0</div>
        </div>
        <div class="calculator-grid">
          <button class="calc-btn operator" type="button" data-value="C">C</button>
          <button class="calc-btn operator" type="button" data-value="±">±</button>
          <button class="calc-btn operator" type="button" data-value="%">%</button>
          <button class="calc-btn operator" type="button" data-value="/">÷</button>

          <button class="calc-btn" type="button" data-value="7">7</button>
          <button class="calc-btn" type="button" data-value="8">8</button>
          <button class="calc-btn" type="button" data-value="9">9</button>
          <button class="calc-btn operator" type="button" data-value="*">×</button>

          <button class="calc-btn" type="button" data-value="4">4</button>
          <button class="calc-btn" type="button" data-value="5">5</button>
          <button class="calc-btn" type="button" data-value="6">6</button>
          <button class="calc-btn operator" type="button" data-value="-">−</button>

          <button class="calc-btn" type="button" data-value="1">1</button>
          <button class="calc-btn" type="button" data-value="2">2</button>
          <button class="calc-btn" type="button" data-value="3">3</button>
          <button class="calc-btn operator" type="button" data-value="+">+</button>

          <button class="calc-btn" type="button" data-value="⌫">⌫</button>
          <button class="calc-btn" type="button" data-value="0">0</button>
          <button class="calc-btn" type="button" data-value=".">.</button>
          <button class="calc-btn equals" type="button" data-value="=">=</button>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container text-center">
      <p class="mb-0">&copy; 2026 Fajr Frontend Project. Built with HTML5, CSS3, Bootstrap 5 &amp; Vanilla JS</p>
    </div>
  </footer>

  <button id="back-to-top" type="button" aria-label="Back to top">↑</button>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/calculator.js"></script>
</body>
</html>
